    <style>
      /* boot splash: painted straight from the HTML so nobody ever sees a blank white page while the app loads */
      html, body { margin: 0; background: #6e0d12; }
      #boot { position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px;
        background: radial-gradient(1200px 820px at 50% 35%, #c4242a 0%, #a3171c 50%, #6e0d12 100%); transition: opacity .4s ease; }
      #boot.boot-hide { opacity: 0; pointer-events: none; }
      #boot img { width: min(62vw, 300px); height: auto; filter: drop-shadow(0 6px 10px rgba(40,0,0,.35)); animation: boot-bob 2.4s ease-in-out infinite; }
      #boot .b { animation: boot-twinkle 1.1s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 0; }
      #boot .b:nth-of-type(2) { animation-delay: .18s } #boot .b:nth-of-type(3) { animation-delay: .36s }
      #boot .b:nth-of-type(4) { animation-delay: .54s } #boot .b:nth-of-type(5) { animation-delay: .72s }
      #boot .f { position: absolute; top: -10px; width: 6px; height: 6px; border-radius: 50%; background: #fffbf5; opacity: .7; animation: boot-fall 7s linear infinite; }
      @keyframes boot-twinkle { 0%, 100% { opacity: .28; transform: rotate(-6deg) } 45% { opacity: 1; transform: rotate(6deg) } }
      @keyframes boot-bob { 0%, 100% { transform: translateY(0) } 50% { transform: translateY(-6px) } }
      @keyframes boot-fall { to { transform: translate3d(20px, 105vh, 0) } }
      @media (prefers-reduced-motion: reduce) { #boot img, #boot .b, #boot .f { animation: none } #boot .b { opacity: 1 } }
    </style>
  </head>
  <body>
    <div id="boot" aria-hidden="true">
      <span class="f" style="left:12%;animation-delay:-1s"></span><span class="f" style="left:31%;animation-delay:-4s;width:4px;height:4px"></span>
      <span class="f" style="left:58%;animation-delay:-2.5s"></span><span class="f" style="left:77%;animation-delay:-5.5s;width:5px;height:5px"></span>
